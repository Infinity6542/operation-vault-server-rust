[package]
name = "opvault-server-rust"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.15"
aws-sdk-s3 = { version = "1.128.0", features = ["rt-tokio"] }
base64 = "0.22.1"
env_logger = "0.11.10"
include_dir = "0.7.4"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["full"] }
wtransport = "0.7.0"
